<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <form>
        <fieldset>
            <legend>1. Personal Information</legend>

            <label>Full Name : </label>
            <input type="text" placeholder="Enter your name">
            <br><br>

            <label>Create Password</label>
            <input type="password" placeholder="create new password">
            <br><br>

            <label>Email Address</label>
            <input type="text" placeholder="Enter email address">
            <br><br>

            <label>Mobile Number</label>
            <input type="number" placeholder="Enter Mobile Number">
            <br><br>

            <label>Age</label>
            <input type="number" placeholder="Enter 10 digits">
            <br><br>

            <label>Date of Birth</label>
            <input type="date">
            <br><br>

            <label>Gender</label>
            <input type="radio"> Male
            <input type="radio"> Female
            <input type="radio"> other

            <br><br>

            <label>Current Address</label>
            <br>
            <textarea maxlength="15" placeholder="Enter your Address"></textarea>
            <br><br>


            <label>Profile pphotograph : </label>
            <input type="file">
            <br><br>

            <label>PortFolio Website</label>
            <input type="text">
            <br><br>



        </fieldset>

        <fieldset>
            <legend>
                2. Education Background
            </legend>

            <label>highest Qualification</label>

            <select>
                <option value="BE">BE</option>
                <option value="BCA">BCA</option>
            </select>
            <br><br>

            <label>Graduation Month</label>
            <input type="date">
            <br><br>

            <label>Preffered internship Week</label>
            <input type="date">
            <br><br>

            <label>Graduation Year</label>
            <input type="number">
            <br><br>

            <label>Certification completed : </label>
            <br>
            <input type="checkbox">
            Java
            <input type="checkbox">
            Dart
            <input type="checkbox">
            Flutter

            <br><br>

            <label>Preffered Interview Date</label>
            <input type="date">
            <br><br><br><br><br>

        </fieldset>


        <fieldset>
            <legend>3. Technical Skills and Experince</legend>

            <label>Years Of Experience</label>
            <input type="number">
            <br><br>

            <label>Preffered Technology</label>
            <input type="number">
            <br><br>

            <label>Technical Skills :</label>
            <select>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
            </select>

            <br><br>

            <label>Use Ctrl (Windows) or Command (Male) to select multiple Skills</label>
            <br><br>

            <label>Upload Resume (PDF only) : </label>
            <input type="file">
            <br><br>

            <label>Upload Certificate</label>
            <input type="file">
            <br><br>

            <label>Why should we hire you :</label>
            <br><br>
            <textarea maxlength="5" placeholder="Describe your Skills and Strengths">
            </textarea>

        </fieldset>



    </form>

</body>

</html>
